<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
  </head>

  <body class="bg-bg text-text">
    <header>
      <div id="navbar"></div>
    </header>

    <main class="mx-auto max-w-300 space-y-6">
      <div class="flex items-start justify-between gap-4 p-6">
        <div>
          <h1 class="text-2xl font-semibold">Browse listings</h1>
          <p class="mt-1 text-muted">Discover items from Noroff students</p>
        </div>

        <a
          href="/create-listing.html"
          class="inline-flex items-center gap-2 rounded-xl bg-accent px-5 py-3 text-sm font-semibold text-text transition hover:bg-primary-hover"
        >
          <span class="text-base font-bold">+</span>
          Create listing
        </a>
      </div>
      <div class="p-6 space-y-4">
        <div class="relative">
          <input
            id="searchInput"
            type="text"
            placeholder="Search listings..."
            class="w-full rounded-xl border border-border bg-surface px-4 py-2 pr-10 text-text placeholder:text-muted outline-none focus:border-primary"
          />

          <button
            id="clearSearch"
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 hidden text-muted hover:text-text"
          >
            ✕
          </button>
        </div>

        <div class="flex flex-col gap-3 sm:flex-row">
          <select
            id="sortSelect"
            class="rounded-xl border border-border bg-surface px-4 py-2 text-text outline-none focus:border-primary"
          >
            <option value="newest">Newest</option>
            <option value="endingSoon">Ending soon</option>
          </select>

          <select
            id="tagFilter"
            class="rounded-xl border border-border bg-surface px-4 py-2 text-text outline-none focus:border-primary"
          >
            <option value="">All categories</option>
          </select>
        </div>

        <p id="noResults" class="hidden text-sm text-muted">
          No listings found.
        </p>
      </div>

      <div
        id="listings"
        class="mx-auto grid grid-cols-1 gap-6 p-6 sm:grid-cols-2 lg:grid-cols-3"
      ></div>
    </main>

    <script type="module" src="/src/js/pages/home.ts"></script>
  </body>
</html>
