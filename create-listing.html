<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Listing</title>
  </head>

  <body class="bg-bg text-text">
    <header>
      <div id="navbar"></div>
    </header>

    <main class="mx-auto max-w-3xl p-6">
      <section
        class="rounded-3xl border border-border bg-surface p-6 shadow-xl"
      >
        <h1 class="text-3xl font-bold">Create listing</h1>
        <p class="mt-2 text-muted">Add an item for other students to bid on.</p>

        <form id="createListingForm" class="mt-6 space-y-5">
          <div>
            <label
              for="title"
              class="mb-2 block text-sm font-medium text-muted"
            >
              Title
            </label>
            <input
              id="title"
              type="text"
              required
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            />
          </div>

          <div>
            <label
              for="description"
              class="mb-2 block text-sm font-medium text-muted"
            >
              Description
            </label>
            <textarea
              id="description"
              rows="5"
              class="w-full resize-none rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            ></textarea>
          </div>

          <div>
            <label
              for="mediaUrl"
              class="mb-2 block text-sm font-medium text-muted"
            >
              Image URL
            </label>
            <input
              id="mediaUrl"
              type="url"
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            />
          </div>

          <div>
            <label for="tags" class="mb-2 block text-sm font-medium text-muted">
              Tags
            </label>
            <input
              id="tags"
              type="text"
              placeholder="electronics, books, furniture"
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            />
          </div>

          <div>
            <label
              for="endsAt"
              class="mb-2 block text-sm font-medium text-muted"
            >
              Deadline
            </label>
            <input
              id="endsAt"
              type="datetime-local"
              required
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none focus:border-primary"
            />
          </div>

          <p id="formMessage" class="hidden rounded-xl p-3 text-sm"></p>

          <button
            type="submit"
            class="rounded-xl bg-primary px-5 py-3 font-semibold text-text transition hover:bg-primary-hover"
          >
            Create listing
          </button>
        </form>
      </section>
    </main>

    <script type="module" src="/src/js/pages/createListing.ts"></script>
  </body>
</html>
