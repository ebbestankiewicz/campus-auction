<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>

  <body class="bg-bg text-text">
    <header>
      <div id="navbar"></div>
    </header>

    <main class="mx-auto max-w-150 p-6">
      <section
        class="rounded-3xl border border-border bg-surface p-6 shadow-xl"
      >
        <h1 class="text-2xl font-semibold">Register</h1>
        <p class="mt-2 text-muted">
          Create an account using your Noroff student email.
        </p>

        <form id="registerForm" class="mt-6 flex flex-col gap-4">
          <div>
            <label for="name" class="mb-2 block text-sm font-medium text-muted">
              Name
            </label>
            <input
              id="name"
              name="name"
              type="text"
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            />
          </div>

          <div>
            <label
              for="email"
              class="mb-2 block text-sm font-medium text-muted"
            >
              Student email
            </label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="name@stud.noroff.no"
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            />
          </div>

          <div>
            <label
              for="password"
              class="mb-2 block text-sm font-medium text-muted"
            >
              Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            />
          </div>

          <p id="registerMessage" class="text-sm text-muted"></p>

          <button
            type="submit"
            class="rounded-xl bg-primary px-5 py-3 font-semibold text-text transition hover:bg-primary-hover"
          >
            Register
          </button>

          <p class="text-sm text-muted">
            Already have an account?
            <a
              href="/login.html"
              class="font-semibold text-text hover:text-accent"
            >
              Log in
            </a>
          </p>
        </form>
      </section>
    </main>

    <script type="module" src="/src/js/pages/register.ts"></script>
  </body>
</html>
