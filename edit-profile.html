<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
  </head>

  <body class="bg-bg text-text">
    <header>
      <div id="navbar"></div>
    </header>

    <main class="mx-auto max-w-3xl p-6">
      <section
        class="rounded-3xl border border-border bg-surface p-6 shadow-xl"
      >
        <div class="mb-6">
          <h1 class="text-3xl font-bold">Edit profile</h1>
          <p class="mt-2 text-muted">Update your bio, avatar and banner.</p>
        </div>

        <form id="editProfileForm" class="space-y-5">
          <div>
            <label
              for="avatarUrl"
              class="mb-2 block text-sm font-medium text-muted"
            >
              Avatar URL
            </label>
            <input
              id="avatarUrl"
              type="url"
              placeholder="https://example.com/avatar.jpg"
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            />
          </div>

          <div>
            <label
              for="bannerUrl"
              class="mb-2 block text-sm font-medium text-muted"
            >
              Banner URL
            </label>
            <input
              id="bannerUrl"
              type="url"
              placeholder="https://example.com/banner.jpg"
              class="w-full rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            />
          </div>

          <div>
            <label for="bio" class="mb-2 block text-sm font-medium text-muted">
              Bio
            </label>
            <textarea
              id="bio"
              rows="5"
              placeholder="Tell other students about yourself"
              class="w-full resize-none rounded-xl border border-border bg-bg px-4 py-3 text-text outline-none placeholder:text-muted focus:border-primary"
            ></textarea>
          </div>

          <p id="formMessage" class="hidden rounded-xl p-3 text-sm"></p>

          <div class="flex flex-col gap-3 sm:flex-row">
            <button
              type="submit"
              class="rounded-xl bg-primary px-5 py-3 font-semibold text-text transition hover:bg-primary-hover"
            >
              Save changes
            </button>

            <a
              href="/profile.html"
              class="rounded-xl border border-border px-5 py-3 text-center font-semibold text-muted transition hover:border-primary hover:text-text"
            >
              Cancel
            </a>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="/src/js/pages/editProfile.ts"></script>
  </body>
</html>
