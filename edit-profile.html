<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
  </head>
  <body class="bg-slate-950 text-white">
    <header>
      <div id="navbar"></div>
    </header>

    <main class="mx-auto max-w-3xl p-6">
      <section
        class="rounded-3xl border border-slate-800 bg-slate-900 p-6 shadow-xl"
      >
        <div class="mb-6">
          <h1 class="text-3xl font-bold">Edit profile</h1>
          <p class="mt-2 text-slate-400">Update your bio, avatar and banner.</p>
        </div>

        <form id="editProfileForm" class="space-y-5">
          <div>
            <label
              for="avatarUrl"
              class="mb-2 block text-sm font-medium text-slate-300"
              >Avatar URL</label
            >
            <input
              id="avatarUrl"
              type="url"
              class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none focus:border-purple-500"
              placeholder="https://example.com/avatar.jpg"
            />
          </div>

          <div>
            <label
              for="bannerUrl"
              class="mb-2 block text-sm font-medium text-slate-300"
              >Banner URL</label
            >
            <input
              id="bannerUrl"
              type="url"
              class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none focus:border-purple-500"
              placeholder="https://example.com/banner.jpg"
            />
          </div>

          <div>
            <label
              for="bio"
              class="mb-2 block text-sm font-medium text-slate-300"
              >Bio</label
            >
            <textarea
              id="bio"
              rows="5"
              class="w-full resize-none rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none focus:border-purple-500"
              placeholder="Tell other students about yourself"
            ></textarea>
          </div>

          <p id="formMessage" class="hidden rounded-xl p-3 text-sm"></p>

          <div class="flex flex-col gap-3 sm:flex-row">
            <button
              type="submit"
              class="rounded-xl bg-purple-600 px-5 py-3 font-semibold text-white transition hover:bg-purple-700"
            >
              Save changes
            </button>

            <a
              href="/profile.html"
              class="rounded-xl border border-slate-700 px-5 py-3 text-center font-semibold text-slate-300 transition hover:border-purple-500 hover:text-white"
            >
              Cancel
            </a>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="/src/js/pages/editProfile.ts"></script>
  </body>
</html>
